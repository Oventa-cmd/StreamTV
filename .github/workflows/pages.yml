name: Web-Version (GitHub Pages)

# Dieselbe Oberfläche wie in der TV-App, als Web-App für iPad, Laptop & Co.
on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/assets/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r app/src/main/assets/. _site/
          cp -r web/. _site/
          touch _site/.nojekyll
          # Cache-Buster, damit iPad/Safari nach jedem Push die neue Version lädt
          v="${GITHUB_SHA::8}"
          sed -i -E "s/(src|href)=\"([a-z0-9.-]+\.(js|css))\"/\1=\"\2?v=$v\"/g" _site/index.html
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
